<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RPG風 Web サイト</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

        body {
            background: radial-gradient(ellipse at 50% 30%, #2a1040 0%, #0a0510 70%);
            min-height:100vh; min-height:100dvh;
            display:flex; flex-direction:column; align-items:center;
            padding:10px 8px 130px;
            font-family:'DotGothic16','MS Gothic',monospace;
            color:#fff; overflow-x:hidden;
        }
        @media (pointer:fine) { body { cursor:none; } }

        #cursor {
            position:fixed; pointer-events:none; z-index:9999;
            width:0; height:0;
            border-style:solid; border-width:8px 0 8px 14px;
            border-color:transparent transparent transparent #fff;
            transform:translate(-50%,-50%);
            filter:drop-shadow(0 0 4px #c8b870);
        }
        @media (pointer:coarse) { #cursor { display:none; } }

        .frame { width:100%; max-width:600px; }

        .win {
            background:#000080;
            border:3px solid #c8b870;
            box-shadow:inset 0 0 0 2px #000040;
            padding:10px 14px;
            margin-bottom:6px;
        }

        #statusWin {
            display:flex; justify-content:space-between; align-items:center;
            flex-wrap:wrap; gap:4px;
            font-size:clamp(0.62rem,2.4vw,0.8rem);
        }
        .bar-wrap { display:flex; align-items:center; gap:4px; }
        .bar-track { width:clamp(48px,11vw,78px); height:9px; background:#000040; border:1px solid #555; }
        .bar-hp { height:100%; width:80%; background:linear-gradient(90deg,#00c864,#64ff64); }
        .bar-mp { height:100%; width:60%; background:linear-gradient(90deg,#3264c8,#64a8ff); }

        #msgWin {
            min-height:90px; position:relative;
            line-height:1.9; font-size:clamp(0.85rem,3.1vw,1.05rem);
        }
        #tcur {
            display:inline-block; width:10px; height:14px;
            background:#c8b870; vertical-align:bottom; margin-left:2px;
            animation:blink 0.7s step-end infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
        #arrow {
            position:absolute; bottom:8px; right:10px;
            color:#c8b870; font-size:1rem; display:none;
            animation:bounce 0.6s ease-in-out infinite alternate;
        }
        #arrow.show { display:block; }
        @keyframes bounce { from{transform:translateY(0)} to{transform:translateY(4px)} }

        #cmdWin { display:grid; grid-template-columns:1fr 1fr; }
        .cmd {
            padding:10px 8px; min-height:48px;
            font-size:clamp(0.85rem,3vw,1rem);
            display:flex; align-items:center;
            touch-action:manipulation; cursor:pointer;
        }
        .cmd::before { content:"　"; width:20px; flex-shrink:0; }
        .cmd.on { background:rgba(200,184,112,0.2); }
        .cmd.on::before { content:"▶ "; color:#c8b870; }
        .cmd:active { background:rgba(200,184,112,0.4) !important; }

        .hint { font-size:0.68rem; color:#8080a0; text-align:center; margin-top:4px; }
        @media (pointer:coarse) { .hint { display:none; } }

        #ov {
            position:fixed; inset:0; background:#000; z-index:999;
            pointer-events:none; opacity:0; transition:opacity 0.28s;
        }
        #ov.on { opacity:1; }

        #ctrl {
            display:none;
            position:fixed; bottom:0; left:0; right:0;
            background:rgba(0,0,50,0.97);
            border-top:3px solid #c8b870;
            padding:10px 16px;
            padding-bottom:max(10px, env(safe-area-inset-bottom));
            z-index:200;
            justify-content:center; align-items:center; gap:16px;
        }
        @media (pointer:coarse) { #ctrl { display:flex; } }

        .dpad { display:grid; grid-template-columns:repeat(3,44px); grid-template-rows:repeat(3,44px); gap:3px; }
        .dp {
            background:#000050; border:2px solid #444; border-radius:6px;
            color:#c8b870; font-size:1.1rem;
            display:flex; align-items:center; justify-content:center;
            touch-action:manipulation; user-select:none;
        }
        .dp:active { background:#0000b0; border-color:#c8b870; }
        .dp.x { background:transparent; border-color:transparent; pointer-events:none; }

        .abtns { display:flex; flex-direction:column; gap:10px; margin-left:8px; }
        .ab {
            font-family:'DotGothic16',monospace; font-size:0.9rem;
            border-radius:8px; padding:11px 16px; min-width:88px;
            text-align:center; touch-action:manipulation; user-select:none; cursor:pointer;
        }
        .ab-a { background:#000080; border:2px solid #c8b870; color:#c8b870; }
        .ab-a:active { background:#0000c0; }
        .ab-b { background:#500000; border:2px solid #a04040; color:#ffaaaa; }
        .ab-b:active { background:#700000; }
    </style>
</head>
<body>
<div id="cursor"></div>
<div id="ov"></div>

<div class="frame">
    <div class="win" id="statusWin">
        <span style="color:#c8b870">🗡 CHOCO</span>
        <div class="bar-wrap">HP<div class="bar-track"><div class="bar-hp"></div></div></div>
        <div class="bar-wrap">MP<div class="bar-track"><div class="bar-mp"></div></div></div>
        <span id="loc" style="color:#a0d0ff;font-size:clamp(0.62rem,2.4vw,0.8rem)">📍 玄関ホール</span>
    </div>
    <div class="win" id="msgWin">
        <span id="msg"></span><span id="tcur"></span>
        <span id="arrow">▼</span>
    </div>
    <div class="win" id="cmdWin"></div>
    <p class="hint">[ ↑↓←→ ] 選択 ／ [ Enter ] 決定 ／ [ Esc ] もどる</p>
</div>

<div id="ctrl">
    <div class="dpad">
        <div class="dp x"></div><div class="dp" id="dU">▲</div><div class="dp x"></div>
        <div class="dp" id="dL">◀</div><div class="dp x"></div><div class="dp" id="dR">▶</div>
        <div class="dp x"></div><div class="dp" id="dD">▼</div><div class="dp x"></div>
    </div>
    <div class="abtns">
        <div class="ab ab-a" id="btnA">けってい</div>
        <div class="ab ab-b" id="btnB">もどる</div>
    </div>
</div>

<script>
var S = {
    home: {
        loc:  "📍 玄関ホール",
        msg:  "ここは冒険者 CHOCO のアトリエ。\nなにを調べますか？",
        cmds: [
            { t:"つよさ をみる",     to:"skills"  },
            { t:"さくひん をみる",   to:"works"   },
            { t:"れんらく する",     to:"contact" },
            { t:"ものがたり をきく", to:"about"   }
        ]
    },
    skills: {
        loc:  "📍 修練の間",
        msg:  "CHOCO の ちからを しらべた。\n\n⚔ TypeScript    ★★★★★\n🔮 React/Next.js ★★★★★\n🛡 Go / Python   ★★★★☆\n✨ AI 連携       ★★★★☆\n🗺 DB設計        ★★★★☆",
        cmds: [
            { t:"さらにくわしく", to:"skills2" },
            { t:"もどる",         to:"home"    }
        ]
    },
    skills2: {
        loc:  "📍 修練の間・深部",
        msg:  "使いこなす武器の数々……\n\n🖥 VS Code / Claude Code\n🌐 Next.js / Tailwind CSS\n⚙ Node.js / Prisma / tRPC\n☁ Vercel / Cloudflare Workers\n🤖 Gemini / Claude API",
        cmds: [
            { t:"もどる",    to:"skills" },
            { t:"トップへ", to:"home"   }
        ]
    },
    works: {
        loc:  "📍 宝物庫",
        msg:  "これまでの冒険の記録……\n\n🏰 フルスタック Web アプリ\n🌱 水耕栽培モニタリング\n🎮 LoL データダッシュボード\n📝 AI 活用コーディングツール",
        cmds: [
            { t:"GitHub をひらく", fn: function(){ window.open("https://github.com","_blank"); } },
            { t:"もどる",          to:"home" }
        ]
    },
    contact: {
        loc:  "📍 伝書鳩の塔",
        msg:  "CHOCO に ことづてを たのんだ。\n\n📧 hello@example.com\n🐦 @duckchoco_dev\n💼 LinkedIn プロフィール",
        cmds: [
            { t:"メールをおくる", fn: function(){ location.href="mailto:hello@example.com"; } },
            { t:"もどる",         to:"home" }
        ]
    },
    about: {
        loc:  "📍 記録の書架",
        msg:  "冒険者は 長野の山里に生まれ、\nWeb の世界を旅して はや 数年。\nモーターサイクルと カラオケと\nLoL を こよなく愛する エンジニア。\n日々 AI と共に コードを紡ぐ。",
        cmds: [
            { t:"もどる", to:"home" }
        ]
    }
};

var cur_scene = "home";
var sel_idx   = 0;
var typing    = false;
var type_tid  = null;
var busy      = false;

var msgEl  = document.getElementById("msg");
var tcur   = document.getElementById("tcur");
var arrow  = document.getElementById("arrow");
var cmdWin = document.getElementById("cmdWin");
var locEl  = document.getElementById("loc");
var ov     = document.getElementById("ov");
var msgWin = document.getElementById("msgWin");

var curEl = document.getElementById("cursor");
document.addEventListener("mousemove", function(e) {
    curEl.style.left = e.clientX + "px";
    curEl.style.top  = e.clientY + "px";
});

function renderCmds() {
    var cmds = S[cur_scene].cmds;
    cmdWin.innerHTML = "";
    for (var i = 0; i < cmds.length; i++) {
        (function(idx) {
            var div = document.createElement("div");
            div.className = "cmd" + (idx === sel_idx ? " on" : "");
            div.textContent = cmds[idx].t;
            div.addEventListener("mouseenter", function() {
                sel_idx = idx;
                renderCmds();
            });
            div.addEventListener("click", function() {
                sel_idx = idx;
                renderCmds();
                execCmd();
            });
            cmdWin.appendChild(div);
        })(i);
    }
}

function execCmd() {
    if (busy) return;
    var cmd = S[cur_scene].cmds[sel_idx];
    if (!cmd) return;
    cmdWin.style.borderColor = "#fff";
    setTimeout(function(){ cmdWin.style.borderColor = "#c8b870"; }, 120);
    if (cmd.fn) cmd.fn();
    else if (cmd.to) goScene(cmd.to);
}

function goScene(key) {
    if (busy) return;
    busy = true;
    ov.classList.add("on");
    setTimeout(function() {
        cur_scene = key;
        sel_idx   = 0;
        locEl.textContent = S[key].loc;
        renderCmds();
        ov.classList.remove("on");
        busy = false;
        setTimeout(function() {
            typeMsg(S[key].msg, null);
        }, 80);
    }, 300);
}

function typeMsg(text, done) {
    clearTimeout(type_tid);
    msgEl.innerHTML = "";
    tcur.style.display = "inline-block";
    arrow.classList.remove("show");
    typing = true;

    var chars = [];
    var lines = text.split("\n");
    for (var l = 0; l < lines.length; l++) {
        var cs = lines[l].split("");
        for (var c = 0; c < cs.length; c++) chars.push(cs[c]);
        if (l < lines.length - 1) chars.push("\n");
    }

    var i = 0;
    function tick() {
        if (i >= chars.length) {
            typing = false;
            tcur.style.display = "none";
            arrow.classList.add("show");
            if (done) done();
            return;
        }
        var ch = chars[i++];
        if (ch === "\n") {
            msgEl.innerHTML += "<br>";
        } else {
            msgEl.innerHTML += ch.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
        }
        type_tid = setTimeout(tick, ch === "\n" ? 55 : 32);
    }
    tick();
}

function skipType() {
    if (!typing) return;
    clearTimeout(type_tid);
    typing = false;
    tcur.style.display = "none";
    arrow.classList.add("show");
    var lines = S[cur_scene].msg.split("\n");
    msgEl.innerHTML = lines.map(function(l){
        return l.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }).join("<br>");
}

document.addEventListener("keydown", function(e) {
    var len = S[cur_scene].cmds.length;
    if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        if (typing) skipType(); else execCmd();
    } else if (e.key === "Escape") {
        if (cur_scene !== "home") goScene("home");
    } else if (e.key === "ArrowUp") {
        e.preventDefault();
        var step = len > 2 ? 2 : 1;
        sel_idx = (sel_idx - step + len) % len; renderCmds();
    } else if (e.key === "ArrowDown") {
        e.preventDefault();
        var step = len > 2 ? 2 : 1;
        sel_idx = (sel_idx + step) % len; renderCmds();
    } else if (e.key === "ArrowLeft") {
        e.preventDefault(); sel_idx = (sel_idx - 1 + len) % len; renderCmds();
    } else if (e.key === "ArrowRight") {
        e.preventDefault(); sel_idx = (sel_idx + 1) % len; renderCmds();
    }
});

function bindDpad(id, dir) {
    var el = document.getElementById(id);
    function act(e) {
        e.preventDefault();
        var len = S[cur_scene].cmds.length;
        var step = len > 2 ? 2 : 1;
        if      (dir==="up")    sel_idx = (sel_idx - step + len) % len;
        else if (dir==="down")  sel_idx = (sel_idx + step) % len;
        else if (dir==="left")  sel_idx = (sel_idx - 1 + len) % len;
        else if (dir==="right") sel_idx = (sel_idx + 1) % len;
        renderCmds();
    }
    el.addEventListener("touchstart", act, { passive:false });
    el.addEventListener("click", act);
}
bindDpad("dU","up"); bindDpad("dD","down");
bindDpad("dL","left"); bindDpad("dR","right");

document.getElementById("btnA").addEventListener("touchstart", function(e) {
    e.preventDefault();
    if (typing) skipType(); else execCmd();
}, { passive:false });
document.getElementById("btnA").addEventListener("click", function() {
    if (typing) skipType(); else execCmd();
});

document.getElementById("btnB").addEventListener("touchstart", function(e) {
    e.preventDefault();
    if (cur_scene !== "home") goScene("home");
}, { passive:false });
document.getElementById("btnB").addEventListener("click", function() {
    if (cur_scene !== "home") goScene("home");
});

msgWin.addEventListener("touchstart", function(e) {
    if (typing) { e.preventDefault(); skipType(); }
}, { passive:false });
msgWin.addEventListener("click", function() {
    if (typing) skipType();
});

goScene("home");
</script>
</body>
</html>
